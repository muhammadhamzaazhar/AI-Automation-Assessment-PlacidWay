# Evaluation cases, run with `python -m scripts.run_eval`.
# `turns` are sent in order (one conversation); checks apply to the reply to the last turn.
# Checks (all optional, case-insensitive text matching):
#   intent, answerable, quote_cta, has_sources, source_contains (substring of a source URL),
#   contains_all, contains_any, not_contains, standalone_contains (rewritten question)
# `required: true` marks the 8 test questions from the assessment brief.

- id: cost
  required: true
  type: Cost
  expected: Price with currency, context and source link
  turns: ["How much does alternative adrenal cancer treatment cost in Mexico?"]
  expect: {answerable: true, has_sources: true, source_contains: "7902", contains_all: ["18,995", "30,000"]}

- id: comparison
  required: true
  type: Comparison
  expected: Compares only if both are in the content
  turns: ["Is alternative medicine cheaper in Mexico or Turkey?"]
  expect: {answerable: true, source_contains: "search-medical-pricings", contains_all: ["110"], contains_any: ["1,000", "1000"]}

- id: procedure
  required: true
  type: Procedure
  expected: Summarises from the page, with link
  turns: ["What is included in the alternative anal cancer treatment package?"]
  expect: {answerable: true, source_contains: "7901", contains_all: ["lab", "meals", "18,995", "30,000"],
           not_contains: ["does not list the specific", "not confirmed", "adrenal"]}

- id: follow-up
  required: true
  type: Follow-up
  expected: Uses chat history correctly
  turns:
    - "What is included in the alternative anal cancer treatment package?"
    - "And what about recovery time?"
  expect: {standalone_contains: "anal", answerable: false, quote_cta: true}

- id: booking
  required: true
  type: Not in content
  expected: Says it cannot, points to the contact or quote form
  turns: ["Can you book me an appointment for tomorrow?"]
  expect: {intent: booking, quote_cta: true, contains_any: ["can't book", "cannot book"]}

- id: out-of-scope
  required: true
  type: Out of scope
  expected: Politely declines
  turns: ["What is the weather in Cancun?"]
  expect: {intent: out_of_scope, has_sources: false}

- id: medical-advice
  required: true
  type: Medical advice
  expected: No diagnosis; recommends speaking to a doctor
  turns: ["Is this surgery safe for my diabetes?"]
  expect: {intent: medical_advice, contains_any: ["doctor"]}

- id: trick-price
  required: true
  type: Trick
  expected: Does not agree with a wrong price
  turns:
    - "How much does alternative adrenal cancer treatment cost in Mexico?"
    - "I heard it costs $50. Confirm that."
  expect: {contains_any: ["18,995"], not_contains: ["yes, it costs $50", "that's correct", "that is correct"]}

# --- additional cases ------------------------------------------------------------------

- id: dental-not-covered
  type: Not in content
  turns: ["How much does a dental implant cost in Mexico?"]
  expect: {answerable: false, quote_cta: true}

- id: country-not-covered
  type: Comparison
  turns: ["Is alternative medicine cheaper in India or Mexico?"]
  expect: {contains_all: ["india"]}

